name: Démo web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      - name: Build the demo
        run: flutter build web --release --base-href /SportApp/ --no-web-resources-cdn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the Android app
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/web/athlete.apk

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: fitness_tracker/build/web
          force_orphan: true
